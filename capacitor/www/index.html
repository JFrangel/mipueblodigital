<!doctype html>
<html lang="es">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mi Pueblo Digital</title>
  <!--SERVIDOR-->
  <!--
    La única página que lleva el APK dentro.

    Se ve en un caso y solo en uno: el primer arranque de la aplicación recién
    instalada sin señal, cuando la ventana todavía no ha podido alcanzar el
    servidor ni una vez y por tanto no hay nada guardado. A partir de la primera
    visita con red, manda el service worker de la aplicación y esta página no
    vuelve a aparecer.

    **La ve quien más falta le hace que funcione.** En este territorio unas
    cuantas instalaciones van a ser alguien pasando el archivo por Bluetooth o
    por una memoria, y abriéndolo donde no hay señal.

    Va sin hoja de estilos aparte ni tipografías de fuera, porque en el momento
    en que se ve no hay de dónde traerlas.
  -->
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #f5f7f2;
      color: #143a2c;
      font: 15px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 34ch; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #4a5b52; margin: 0 0 18px; }
    button {
      min-height: 46px;
      padding: 12px 22px;
      border: 0;
      border-radius: 9px;
      background: #18533a;
      color: #fff;
      font: inherit;
      font-weight: 600;
    }
  </style>
  <main>
    <h1>Falta la primera conexión</h1>
    <p>
      Mi Pueblo Digital necesita conectarse una vez para quedar lista. Después
      funciona sin señal: podrás reportar, leer tus reportes y los comunicados
      aunque no haya red.
    </p>
    <p id="pista">Busca señal y vuelve a intentarlo.</p>
    <button id="reintentar" type="button">Reintentar</button>
  </main>
  <script>
    /*
      Reintentar, con la dirección puesta al compilar.

      Esta página no puede averiguar sola dónde vive la aplicación: se sirve
      desde `localhost` y el puente de Capacitor, aunque se inyecta, no trae ni
      la dirección ni los complementos —comprobado: `Capacitor.Plugins` no
      existe aquí—. Se la pone `scripts/inyectar-servidor.mjs` al sincronizar,
      en la copia que git ignora, para que no quede escrita en el repositorio.

      **No se puede recargar.** Recargar pide `localhost` otra vez, y Capacitor,
      que espera la aplicación en otra dirección, trata eso como una navegación
      a otro sitio y **la abre en Chrome**: eso hacía el botón anterior, medido
      en el emulador, y dejaba a la persona fuera de su propia aplicación.
      `history.back()` tampoco: vuelve, pero no recarga.

      Sin la dirección —alguien compiló saltándose el guion— se dice qué hacer
      a mano, que es lo único honesto que queda.
    */
    document.getElementById("reintentar").addEventListener("click", function () {
      if (window.MPD_APP) location.replace(window.MPD_APP);
      else
        document.getElementById("pista").textContent =
          "Busca señal, cierra la aplicación deslizándola fuera de las aplicaciones recientes y vuelve a abrirla.";
    });
  </script>
</html>
